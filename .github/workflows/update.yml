name: Update league data

on:
  schedule:
    - cron: "0 11 * * 2"   # Tuesdays, 11:00 UTC (after Monday Night Football)
    - cron: "0 11 * * 3"   # Wednesdays, as a backup for stat corrections
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install espn-api numpy
      - run: python fetch_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update league data"
          git push
