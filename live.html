<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Leaderboard</title>
<style>
:root{--bg:#f5f6f2;--surface:#fff;--ink:#1b2a22;--muted:#5d6b63;--line:#d9ddd4;--accent:#1f5f46;--head:#1f3a2e;--headink:#f5f6f2;--up:rgba(46,160,67,.13);--down:rgba(218,54,51,.10);--upstrong:rgba(46,160,67,.28);--downstrong:rgba(218,54,51,.24);--grey:rgba(128,128,128,.16);--good:#22a243;--bad:#e03a3e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1713;--surface:#16211b;--ink:#e8eee9;--muted:#9aa9a0;--line:#2b3a31;--accent:#7fd1a6;--head:#0b110e;--headink:#e8eee9;--up:rgba(46,200,90,.20);--down:rgba(255,75,75,.18);--upstrong:rgba(46,200,90,.42);--downstrong:rgba(255,75,75,.38)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 0 32px}
header,.note,.mu-title{padding:0 16px}
h1{font-size:1.4rem;margin:0 0 2px}.sub{color:var(--muted);margin:0 0 12px}a{color:var(--accent)}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
label{font-weight:600;margin-right:6px}
select,button.btn{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
button.btn{cursor:pointer}
.note{color:var(--muted);font-size:.85rem;margin-top:10px}
.wrap{overflow-x:auto;margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:center}
th{background:var(--head);color:var(--headink);cursor:pointer;user-select:none;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;white-space:normal;line-height:1.15}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;min-width:140px;max-width:180px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);background:var(--surface)}
th:first-child{background:var(--head);z-index:2}
th.num,td.num{text-align:right}
tr.above td{background-image:linear-gradient(var(--up),var(--up))}tr.below td{background-image:linear-gradient(var(--down),var(--down))}
.rk{color:var(--muted);display:inline-block;min-width:1.6em}.team{font-weight:600}.score{font-weight:700}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
.pill.above{background:var(--upstrong)}.pill.below{background:var(--downstrong)}.pill.at{background:var(--grey)}
.y{color:var(--good);font-weight:800}.n{color:var(--bad);font-weight:800}
.mu-title{font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.mu-grid{display:grid;gap:6px;padding:0 16px}
.mu{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr);align-items:center;column-gap:.6rem;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);font-size:.9rem}
.mt{display:flex;align-items:baseline;gap:6px;min-width:0;white-space:nowrap}.mt.r{justify-content:flex-end}
.mn{overflow:hidden;text-overflow:ellipsis}.mt.lead .mn{font-weight:700}
.mp{font-size:.75rem;color:var(--muted)}
.ms{min-width:3.4rem;text-align:center;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--grey)}.ms.lead{background:var(--upstrong);font-weight:700}
.vs{font-size:.72rem;text-transform:uppercase;color:var(--muted)}
.empty{padding:20px 16px;color:var(--muted)}
@media (max-width:700px){.mu{font-size:.82rem}.mp{display:none}}
</style>
</head>
<body>
<header>
  <h1>Live leaderboard</h1>
  <p class="sub"><a href="./">&larr; Season stats</a> &middot; <span id="season"></span></p>
  <div class="ctl">
    <span><label for="week">Week</label><select id="week"></select></span>
    <span><input type="checkbox" id="auto" checked> <label for="auto" style="font-weight:400">Auto-refresh (60s)</label></span>
    <button class="btn" id="now">Refresh now</button>
  </div>
</header>
<div id="out"><p class="empty">Loading&hellip;</p></div>
<div id="mu"></div>
<p class="note" id="status"></p>
<script>
(function(){
  var API = 'https://chulentbowl-live.marc-e-blanco.workers.dev';   // <- paste your Cloudflare Worker address here
  var YEAR = 2026;
  var $ = function(id){return document.getElementById(id);};
  var week = null, sortKey = 'score', sortDir = -1, rows = [], median = 0, timer = null;

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function ord(n){var s=(n%100>=10&&n%100<=20)?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th');return n+s;}
  function med(a){var s=a.slice().sort(function(x,y){return x-y;}),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;}
  function wlt(w,l,t){return w+'-'+l+(t?'-'+t:'');}
  function recKey(r){var g=r[0]+r[1]+r[2];return g?(r[0]+r[2]/2)/g+r[0]/10000:0;}
  function getJSON(p){return fetch(API+p,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
  function nz(v){return v===undefined||v===null?null:Number(v);}

  function projOf(e){
    var st=(e.playerPoolEntry&&e.playerPoolEntry.player&&e.playerPoolEntry.player.stats)||[];
    for(var i=0;i<st.length;i++){if(st[i].scoringPeriodId===week&&st[i].statSourceId===1&&st[i].statSplitTypeId===1)return st[i].appliedTotal||0;}
    return 0;
  }
  function side(s, states){
    if(!s||s.teamId===undefined)return null;
    var es=(s.rosterForCurrentScoringPeriod&&s.rosterForCurrentScoringPeriod.entries)||[];
    var starters=es.filter(function(e){return e.lineupSlotId!==20&&e.lineupSlotId!==21;});
    var score=nz(s.totalPointsLive); if(score===null)score=nz(s.totalPoints)||0;
    var proj=nz(s.totalProjectedPointsLive);
    if(proj===null||proj<0){var t=starters.reduce(function(a,e){return a+projOf(e);},0);proj=t>0?Math.round(t*100)/100:null;}
    var left=null;
    if(states){left=starters.filter(function(e){var p=e.playerPoolEntry&&e.playerPoolEntry.player;var st=p&&states[p.proTeamId];return st&&st!=='post';}).length;}
    return {id:s.teamId,score:score,proj:proj,left:left};
  }
  function build(d, sb){
    var teams={};
    (d.teams||[]).forEach(function(t){
      var o=(t.record&&t.record.overall)||{};
      teams[t.id]={name:t.name||((t.location||'')+' '+(t.nickname||'')).trim()||('Team '+t.id),rec:[o.wins||0,o.losses||0,o.ties||0]};
    });
    var states=null;
    if(sb&&sb.events){states={};sb.events.forEach(function(e){var c=e.competitions&&e.competitions[0];if(!c)return;c.competitors.forEach(function(cp){states[cp.team.id]=c.status.type.state;});});}
    var ms=(d.schedule||[]).filter(function(m){return m.matchupPeriodId===week;});
    var list=[];
    ms.forEach(function(m){
      var h=side(m.home,states),a=side(m.away,states);
      if(h)list.push({t:h,o:a,hasOpp:!!a});
      if(a)list.push({t:a,o:h,hasOpp:!!h});
    });
    return {teams:teams,list:list,matchups:ms.map(function(m){return {h:side(m.home,states),a:side(m.away,states)};})};
  }
  function compute(b){
    var projs=b.list.map(function(x){return x.t.proj;});
    var ok=projs.length&&projs.every(function(p){return p!==null;});
    var m=ok?med(projs):null;
    median=med(b.list.map(function(x){return x.t.score;}));
    rows=b.list.map(function(x){
      var tm=b.teams[x.t.id]||{name:'Team '+x.t.id,rec:[0,0,0]};
      var r={name:tm.name,score:x.t.score,proj:x.t.proj,left:x.t.left,rec:tm.rec,wk:null,prec:null,rank:null,vm:null};
      if(ok){
        var g=[];
        if(x.hasOpp){ if(x.o.proj===null)g=null; else g.push(x.o.proj); }
        if(g){
          var w=0,l=0,t=0;
          g.concat([m]).forEach(function(y){if(x.t.proj>y)w++;else if(x.t.proj<y)l++;else t++;});
          r.wk=[w,l,t];r.prec=[tm.rec[0]+w,tm.rec[1]+l,tm.rec[2]+t];
        }
        r.rank=1+projs.filter(function(p){return p>x.t.proj;}).length;
        r.vm=x.t.proj>m?'win':(x.t.proj<m?'loss':'tie');
      }
      return r;
    });
    var srt=rows.slice().sort(function(a,b){return b.score-a.score;});
    rows.forEach(function(r){r.srank=1+srt.filter(function(o){return o.score>r.score;}).length;});
  }
  var COLS=[
    {k:'name',h:'Team',a:'',v:function(r){return r.name.toLowerCase();},c:function(r){return '<span class="rk">'+r.srank+'</span><span class="team">'+esc(r.name)+'</span>';},first:1},
    {k:'score',h:'Score',a:'num',v:function(r){return r.score;},c:function(r){return '<span class="score">'+r.score.toFixed(2)+'</span>';}},
    {k:'status',h:'Status',a:'',v:function(r){return r.score>median?2:(r.score<median?0:1);},c:function(r){var k=r.score>median?'above':(r.score<median?'below':'at');return '<span class="pill '+k+'">'+(k==='above'?'Above':k==='below'?'Below':'At')+' median</span>';}},
    {k:'proj',h:'Projected',a:'num',v:function(r){return r.proj;},c:function(r){
      if(r.proj===null)return '\u2013';
      var mk={win:'<span class="y">\u2714</span>',loss:'<span class="n">\u2716</span>',tie:'\u2013'}[r.vm]||'';
      var p=[];if(r.rank!==null)p.push(ord(r.rank));if(mk)p.push(mk);
      return r.proj.toFixed(2)+(p.length?' ('+p.join(' ')+')':'');}},
    {k:'left',h:'Players remaining',a:'',v:function(r){return r.left;},c:function(r){return r.left===null?'\u2013':r.left;}},
    {k:'rec',h:'Record',a:'',v:function(r){return recKey(r.rec);},c:function(r){return wlt(r.rec[0],r.rec[1],r.rec[2]);}},
    {k:'wk',h:'Projected week',a:'',v:function(r){return r.wk?recKey(r.wk):null;},c:function(r){return r.wk?wlt(r.wk[0],r.wk[1],r.wk[2]):'\u2013';}},
    {k:'prec',h:'Projected record',a:'',v:function(r){return r.prec?recKey(r.prec):null;},c:function(r){return r.prec?wlt(r.prec[0],r.prec[1],r.prec[2]):'\u2013';}}
  ];
  function drawTable(){
    var col=COLS.filter(function(c){return c.k===sortKey;})[0]||COLS[1];
    var s=rows.slice().sort(function(a,b){
      var x=col.v(a),y=col.v(b);
      if(x===null||x===undefined)return 1; if(y===null||y===undefined)return -1;
      return (x<y?-1:x>y?1:0)*sortDir;
    });
    var h='<div class="wrap"><table><thead><tr>';
    COLS.forEach(function(c){h+='<th class="'+c.a+'" data-k="'+c.k+'">'+c.h+(sortKey===c.k?(sortDir===1?' \u25B2':' \u25BC'):'')+'</th>';});
    h+='</tr></thead><tbody>';
    s.forEach(function(r){
      h+='<tr class="'+(r.score>median?'above':r.score<median?'below':'')+'">';
      COLS.forEach(function(c){h+='<td class="'+c.a+'">'+c.c(r)+'</td>';});
      h+='</tr>';
    });
    $('out').innerHTML=h+'</tbody></table></div>';
    Array.prototype.forEach.call($('out').querySelectorAll('th'),function(th){
      th.addEventListener('click',function(){
        var k=th.getAttribute('data-k');
        if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=(k==='name')?1:-1;}
        drawTable();
      });
    });
  }
  function drawMatchups(b){
    var c='';
    function pj(p,o){
      if(p===null)return '';
      var mk=(o===null)?'':(p>o?' <span class="y">\u2714</span>':(p<o?' <span class="n">\u2716</span>':' \u2013'));
      return '<span class="mp">('+p.toFixed(2)+mk+')</span>';
    }
    b.matchups.forEach(function(m){
      if(!m.h)return;
      var hn=esc((b.teams[m.h.id]||{}).name||'Team '+m.h.id);
      if(!m.a){c+='<div class="mu"><span class="mt r"><span class="mn">'+hn+'</span></span><span class="vs" style="grid-column:2/5;text-align:center">bye week</span><span></span></div>';return;}
      var an=esc((b.teams[m.a.id]||{}).name||'Team '+m.a.id);
      var hl=m.h.score>m.a.score?' lead':'',al=m.a.score>m.h.score?' lead':'';
      c+='<div class="mu"><span class="mt r'+hl+'">'+pj(m.h.proj,m.a.proj)+'<span class="mn">'+hn+'</span></span><span class="ms'+hl+'">'+m.h.score.toFixed(2)+'</span><span class="vs">vs</span><span class="ms'+al+'">'+m.a.score.toFixed(2)+'</span><span class="mt l'+al+'"><span class="mn">'+an+'</span>'+pj(m.a.proj,m.h.proj)+'</span></div>';
    });
    $('mu').innerHTML=c?'<div class="mu-title">This week\u2019s matchups</div><div class="mu-grid">'+c+'</div>':'';
  }
  function load(){
    if(API.indexOf('YOUR-WORKER')>-1){$('out').innerHTML='<p class="empty">Setup needed: paste your Cloudflare Worker address into <code>API</code> near the top of live.html.</p>';return;}
    var q='/league?year='+YEAR+'&view=mMatchupScore&view=mScoreboard&view=mTeam'+(week?'&scoringPeriodId='+week:'');
    getJSON(q).then(function(d){
      if(!week){
        week=d.scoringPeriodId||1;
        var s=$('week');if(!s.options.length){for(var i=1;i<=18;i++){var o=document.createElement('option');o.value=i;o.textContent='Week '+i;s.appendChild(o);}}
        s.value=week;
      }
      return getJSON('/scoreboard?year='+YEAR+'&week='+week).catch(function(){return null;}).then(function(sb){return [d,sb];});
    }).then(function(r){
      var b=build(r[0],r[1]);
      if(!b.list.length){$('out').innerHTML='<p class="empty">No matchups found for this week yet.</p>';$('mu').innerHTML='';return;}
      compute(b);drawTable();drawMatchups(b);
      $('status').textContent='Last updated '+new Date().toLocaleTimeString()+' \u00B7 Scores for games in progress are partial, so the median will move.';
    }).catch(function(e){
      $('out').innerHTML='<p class="empty">Could not load live data ('+esc(e.message)+'). Check the Worker address and try again.</p>';
    });
  }
  function schedule(){clearInterval(timer);if($('auto').checked)timer=setInterval(function(){if(!document.hidden)load();},60000);}
  $('season').textContent=YEAR+' season';
  $('week').addEventListener('change',function(){week=+$('week').value;load();});
  $('auto').addEventListener('change',schedule);
  $('now').addEventListener('click',load);
  schedule();load();
})();
</script>
</body>
</html>
